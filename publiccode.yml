description:
  en:
    localisedName: Simply simplify language API
    shortDescription: Simply Simplify German Language -- API Version
    longDescription: "Simply Simplify Language helps public institutions rewrite
      complex official communication into clear, accessible language — commonly
      known in German as «Einfache Sprache» or «Leichte Sprache» — using large
      language models. This is the API version: instead of an interactive app
      for individual staff, it's a lightweight backend service designed to be
      integrated directly into your existing systems, such as a CMS or editorial
      workflow, so text simplification can happen automatically as part of your
      regular publishing process. It accepts batches of text — including HTML
      content, with tags preserved — and returns simplified versions via a
      simple, authenticated REST endpoint. Like the interactive app, it is built
      on OpenRouter, a unified API for accessing commercial language models from
      providers such as OpenAI, Anthropic, Google, and Mistral AI. This reliance
      on external commercial providers is an important consideration: any text
      sent to the API is forwarded to OpenRouter and its partner model
      providers, so the service must not be used with sensitive or confidential
      data."
    documentation: https://github.com/machinelearningZH/simply-simplify-language_api/blob/main/README.md
